# Verloq — verloq.co
#
# Publishes the static site in site/ to Netlify. There is no build step: the
# page is plain HTML, CSS, seven icons and two woff2 fonts.
#
# site/.htaccess is the Apache equivalent of this file. It is kept so the
# GoDaddy cPanel route still works as a fallback; Netlify ignores it.
#
# Not configured here, because Netlify does them natively:
#   - HTTPS and certificate issue      (Domain settings → Force HTTPS)
#   - www → apex redirect              (set the apex as the primary domain)
#   - /privacy serving privacy.html    (extensionless URLs are the default)
#   - 404.html for unmatched paths
#   - gzip and brotli compression

[build]
  publish = "site"
  command = ""

  # Most pushes to this repo touch the app, not the site. Exit 0 skips the
  # deploy, and `git diff --quiet` exits 0 when nothing changed under site/.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- site/"

# --- Security headers -------------------------------------------------------
# Mirrors site/.htaccess. The only outbound request the site makes is the
# waitlist POST, so connect-src and form-action name that host and nothing else.
# Change BOTH if you move off Formspree, or the browser will block the
# submission silently.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self' 'unsafe-inline'; connect-src 'self' https://formspree.io; form-action 'self' https://formspree.io; base-uri 'self'; frame-ancestors 'self'"

    # Pages must not be cached: the filenames carry no fingerprint, so a cached
    # copy would outlive any edit. This rule covers /, /privacy and /404.
    Cache-Control = "no-cache"

# --- Static assets ----------------------------------------------------------
# Everything under assets/ is immutable for a year. Since the names are not
# fingerprinted either, RENAME the file and update the reference when you change
# a stylesheet, font or icon — otherwise returning visitors keep the old one.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
