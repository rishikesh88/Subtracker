<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Verloq</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!--
      Crimson Pro for display and headings, Archivo for the interface,
      JetBrains Mono for values. Loaded here as well as in index.css so the
      faces start downloading before the stylesheet parses.
    -->
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600&family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <!--
      Four icons because no one format covers every place the mark shows up.
      The SVG is what Chrome and Firefox use in the tab. Safari ignores SVG
      icons entirely, so it falls back to the 32px PNG. iOS composites black
      behind a transparent icon, so the home-screen and installed-app icons
      are a solid brand tile with the mark knocked out in white.

      The ?v= on the SVG is deliberate: browsers keep favicons in a long-lived
      cache keyed on the URL, so a changed mark at an unchanged address can go
      unnoticed for weeks. Bump it whenever the logo changes.
    -->
    <link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml">
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="theme-color" content="#4F46E5">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
